# Builds the shop from Square and publishes the site to GitHub Pages.
# Runs on every push, every hour, and on demand (Actions tab → "Build and deploy" → Run workflow).
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull items and stock from Square
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
        run: python3 scripts/build_shop.py

      - name: Collect the files to publish
        run: rsync -a --exclude .git --exclude .github --exclude scripts --exclude templates --exclude README.md ./ _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
      - id: deployment
        uses: actions/deploy-pages@v4
